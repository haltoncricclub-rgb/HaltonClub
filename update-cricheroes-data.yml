name: Update CricHeroes data

on:
  schedule:
    # Runs daily at 11:00 UTC (~7am Eastern). Adjust as you like.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scripts/scrape_cricheroes.py
        continue-on-error: true   # a bad run shouldn't block the commit of last-known-good data

      - name: Commit updated data
        run: |
          git config user.name "cricheroes-bot"
          git config user.email "actions@github.com"
          git add data/cricheroes-data.json
          git diff --cached --quiet || git commit -m "Update CricHeroes data [automated]"
          git push
